services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-local}
        VITE_GITHUB_REPO: ${VITE_GITHUB_REPO:-}
    image: portfolio-web:local
    ports:
      - "8080:80"
    restart: unless-stopped
